spring.application.name=notification-service

# 8006 for a single instance; start a second instance with SERVER_PORT=9006 so both register with Eureka
# under the same name (notification-service) on different ports.
server.port=${SERVER_PORT:8006}

# Local overrides: an optional .env in the working directory (see .env.example) feeds the ${...} placeholders
# below, so `./mvnw spring-boot:run` and `java -jar` read the same file. Real environment variables win over it.
# Values must be unquoted: the file is read as .properties here.
spring.config.import=optional:file:.env[.properties]

# Gmail password / app password, supplied via the GMAIL_PASSWORD environment variable.
# Empty default keeps the context loadable (e.g. in tests); sending mail fails without it.
notification.mail.password=${GMAIL_PASSWORD:}

# A standalone run has no Eureka server: EUREKA_CLIENT_ENABLED=false (in .env) switches the client off.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
